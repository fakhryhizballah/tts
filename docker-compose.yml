version: '3.8'

services:
  tts-server:
    build: .
    container_name: tts-app
    ports:
      - "3000:3000"
    volumes:
      - ./tmp:/app/tmp
      - ./models:/app/models
    environment:
      - NODE_ENV=production
      - PORT=3000
      - BASE_URL=http://localhost:3000
    restart: unless-stopped

